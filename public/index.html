<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Reader</title>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/highlight-github.min.css" id="hljs-light" />
  <link rel="stylesheet" href="/vendor/highlight-github-dark.min.css" id="hljs-dark" disabled />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="brand">📖 Markdown Reader</span>
        <button id="collapse-btn" title="Ocultar panel">⮜</button>
      </div>
      <div class="root-box">
        <div class="root-row">
          <input type="text" id="root-input" placeholder="C:\ruta\a\carpeta" autocomplete="off" spellcheck="false" />
          <button id="root-go" title="Usar esta carpeta como raíz">Ir</button>
        </div>
        <div class="root-actions">
          <button id="root-default" title="Volver a la carpeta por defecto">⟲ Default</button>
          <span id="root-error" class="root-error"></span>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="search" placeholder="Buscar archivo…" autocomplete="off" />
      </div>
      <div id="tree" class="tree"></div>
      <div class="sidebar-footer">
        <span class="root-caption">Raíz actual:</span>
        <span id="root-label"></span>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">
      <header id="topbar">
        <button id="expand-btn" title="Mostrar panel" class="hidden">☰</button>
        <div id="breadcrumb"></div>
        <div class="topbar-actions">
          <span id="file-meta"></span>
          <button id="toc-btn" title="Tabla de contenidos">⋮≡</button>
          <button id="theme-btn" title="Tema claro/oscuro">🌙</button>
          <button id="settings-btn" title="Configuración de estilos">⚙︎</button>
          <button id="print-btn" title="Imprimir / PDF">🖨</button>
        </div>
      </header>

      <div id="content-wrap">
        <article id="content" class="markdown-body">
          <div class="empty-state">
            <h1>📖 Markdown Reader</h1>
            <p>Seleccioná un archivo <code>.md</code> del panel izquierdo para verlo renderizado.</p>
            <p class="hint">Soporta tablas, diagramas Mermaid, resaltado de código, tabla de contenidos y estilos personalizables.</p>
          </div>
        </article>
        <nav id="toc" class="toc hidden"></nav>
      </div>
    </main>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/config.js"></script>
  <script src="/md-core.js"></script>
  <script src="/app.js"></script>
</body>
</html>
