<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Reader</title>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/vendor/highlight-github.min.css" id="hljs-light" />
  <link rel="stylesheet" href="/vendor/highlight-github-dark.min.css" id="hljs-dark" disabled />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="app-switcher-wrap">
          <button id="app-switcher" class="app-switcher" aria-haspopup="true" aria-expanded="false" title="Cambiar de app">
            <i class="bi bi-book-half" id="app-icon"></i>
            <span class="app-title" id="app-title">Markdown Reader</span>
            <span class="version-tag" id="version-tag"></span>
            <i class="bi bi-chevron-down app-caret"></i>
          </button>
          <div id="app-menu" class="app-menu hidden" role="menu">
            <button class="app-option" data-app="reader" role="menuitem">
              <i class="bi bi-book-half"></i>
              <span class="app-option-text">
                <span class="app-option-name">Markdown Reader</span>
                <span class="app-option-desc">Leer .md y mocks HTML</span>
              </span>
              <span class="version-tag">v1.1.0</span>
            </button>
            <button class="app-option" data-app="notes" role="menuitem">
              <i class="bi bi-journal-text"></i>
              <span class="app-option-text">
                <span class="app-option-name">Note Taker</span>
                <span class="app-option-desc">Tomar y crear notas</span>
              </span>
              <span class="version-tag">v1.0.0</span>
            </button>
          </div>
        </div>
        <div class="split-btn hidden" id="new-note-split">
          <button id="new-note-btn" class="split-main" title="Nueva nota (.md)"><i class="bi bi-file-earmark-plus"></i></button>
          <button id="new-note-caret" class="split-caret" aria-haspopup="true" aria-expanded="false" title="Crear desde plantilla"><i class="bi bi-chevron-down"></i></button>
          <div id="template-menu" class="app-menu hidden" role="menu"><!-- poblado por renderTemplateMenu() --></div>
        </div>
        <button id="collapse-btn" title="Ocultar panel"><i class="bi bi-chevron-left"></i></button>
      </div>
      <div class="root-box">
        <div class="root-row">
          <input type="text" id="root-input" placeholder="C:\ruta\a\carpeta" autocomplete="off" spellcheck="false" />
          <button id="root-go" class="root-icon-btn" title="Usar esta carpeta como raíz"><i class="bi bi-arrow-right"></i></button>
          <button id="root-default" class="root-icon-btn" title="Volver a la carpeta por defecto"><i class="bi bi-arrow-counterclockwise"></i></button>
        </div>
        <span id="root-error" class="root-error"></span>
      </div>
      <div class="search-box">
        <div class="search-seg" role="group" aria-label="Modo de búsqueda">
          <button id="mode-files" class="seg-btn active" title="Buscar archivos"><i class="bi bi-file-earmark-text"></i></button>
          <button id="mode-folders" class="seg-btn" title="Buscar carpetas"><i class="bi bi-folder"></i></button>
        </div>
        <input type="text" id="search" placeholder="Buscar archivo…" autocomplete="off" />
      </div>
      <div id="tree" class="tree"></div>
      <div class="sidebar-footer">
        <span class="root-caption">Raíz actual:</span>
        <span id="root-label"></span>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">
      <header id="topbar">
        <button id="expand-btn" title="Mostrar panel" class="hidden"><i class="bi bi-list"></i></button>
        <div id="breadcrumb"></div>
        <div class="topbar-actions">
          <span id="save-status" class="save-status hidden"></span>
          <span id="file-meta"></span>
          <a id="open-tab-btn" class="hidden" title="Abrir mock en pestaña nueva" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i></a>
          <button id="raw-btn" class="hidden" title="Ver original (raw)"><i class="bi bi-code-slash"></i></button>
          <button id="toc-btn" title="Tabla de contenidos"><i class="bi bi-list-nested"></i></button>
          <button id="theme-btn" title="Tema claro/oscuro"><i class="bi bi-moon-stars"></i></button>
          <button id="settings-btn" title="Configuración de estilos"><i class="bi bi-gear"></i></button>
          <button id="print-btn" title="Imprimir / PDF"><i class="bi bi-printer"></i></button>
        </div>
      </header>

      <div id="content-wrap">
        <article id="content" class="markdown-body">
          <div class="empty-state">
            <h1><i class="bi bi-book-half"></i> Markdown Reader</h1>
            <p>Seleccioná un archivo <code>.md</code> o un mock <code>.html</code> del panel izquierdo.</p>
            <p class="hint">Soporta tablas, diagramas Mermaid, resaltado de código, tabla de contenidos, mocks HTML embebidos y estilos personalizables.</p>
          </div>
        </article>
        <nav id="toc" class="toc hidden"></nav>
      </div>
    </main>
  </div>

  <!-- Menú contextual del árbol (renombrar, etc.) -->
  <div id="ctx-menu" class="ctx-menu hidden" role="menu">
    <button class="app-option" data-act="rename" role="menuitem">
      <i class="bi bi-pencil"></i>
      <span class="app-option-text"><span class="app-option-name">Renombrar</span></span>
    </button>
    <button class="app-option ctx-danger" data-act="delete" role="menuitem">
      <i class="bi bi-trash"></i>
      <span class="app-option-text"><span class="app-option-name">Eliminar</span></span>
    </button>
  </div>

  <!-- Modal reutilizable (prompt / alert propios) -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-content" id="modal-content"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/config.js"></script>
  <script src="/md-core.js"></script>
  <script src="/app.js"></script>
</body>
</html>
