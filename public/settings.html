<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuración — Markdown Reader</title>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/highlight-github.min.css" id="hljs-light" />
  <link rel="stylesheet" href="/vendor/highlight-github-dark.min.css" id="hljs-dark" disabled />
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Layout específico de la página de configuración */
    html, body { height: 100%; overflow: hidden; }
    .settings-layout { display: flex; flex-direction: column; height: 100vh; }
    .settings-navbar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 18px; border-bottom: 1px solid var(--ui-border);
      background: var(--ui-panel);
    }
    .settings-navbar .title { font-weight: 600; font-size: 15px; }
    .settings-navbar .spacer { flex: 1; }
    .settings-main { flex: 1; display: flex; min-height: 0; }
    .settings-form {
      width: 380px; min-width: 380px; overflow-y: auto;
      padding: 16px; border-right: 1px solid var(--ui-border);
      background: var(--ui-bg);
    }
    .settings-preview-pane { flex: 1; overflow-y: auto; background: var(--md-bg-color); }
    .settings-form .card { background: var(--ui-panel); border-color: var(--ui-border); }
    .settings-form .card-header {
      font-weight: 600; font-size: 13px; background: transparent;
      color: var(--ui-text); border-color: var(--ui-border);
    }
    .settings-form .form-label { font-size: 13px; margin-bottom: .2rem; color: var(--ui-text); }
    .settings-form .form-label .val { color: var(--ui-muted); font-weight: 400; float: right; }
    .settings-form .form-control, .settings-form .form-select { font-size: 13px; }
    .settings-form .ctl { margin-bottom: .85rem; }
    .preview-hint {
      font-size: 12px; color: var(--ui-muted); padding: 8px 16px;
      border-bottom: 1px solid var(--ui-border); background: var(--ui-panel);
    }
    /* Que el markdown-body de la preview no se centre ni tope ancho del wrapper */
    .settings-preview-pane .markdown-body { margin: 0 auto; }
  </style>
</head>
<body data-theme="light">
  <div class="settings-layout">
    <nav class="settings-navbar">
      <a href="/" class="btn btn-sm btn-outline-secondary">← Volver al lector</a>
      <span class="title">⚙︎ Configuración de estilos</span>
      <span class="spacer"></span>
      <div class="btn-group btn-group-sm" role="group" aria-label="Presets">
        <button class="btn btn-outline-secondary" data-preset="default">Default</button>
        <button class="btn btn-outline-secondary" data-preset="sepia">Sepia</button>
        <button class="btn btn-outline-secondary" data-preset="night">Night</button>
        <button class="btn btn-outline-secondary" data-preset="contrast">Contraste</button>
      </div>
      <button id="reset-btn" class="btn btn-sm btn-outline-danger">Restablecer</button>
    </nav>

    <div class="settings-main">
      <!-- Panel izquierdo: controles -->
      <aside class="settings-form">
        <div class="card mb-3">
          <div class="card-header">Tipografía</div>
          <div class="card-body">
            <div class="ctl">
              <label class="form-label" for="set-fontFamily">Familia tipográfica</label>
              <select class="form-select form-select-sm" id="set-fontFamily">
                <option value="system">Sistema (sans-serif)</option>
                <option value="serif">Serif (lectura)</option>
                <option value="inter">Inter</option>
                <option value="georgia">Georgia</option>
                <option value="mono">Monospace</option>
              </select>
            </div>
            <div class="ctl">
              <label class="form-label" for="set-fontSize">Tamaño de fuente <span class="val" data-val="fontSize"></span></label>
              <input type="range" class="form-range" id="set-fontSize" />
            </div>
            <div class="ctl">
              <label class="form-label" for="set-lineHeight">Interlineado <span class="val" data-val="lineHeight"></span></label>
              <input type="range" class="form-range" id="set-lineHeight" />
            </div>
            <div class="ctl">
              <label class="form-label" for="set-letterSpacing">Espaciado de letras <span class="val" data-val="letterSpacing"></span></label>
              <input type="range" class="form-range" id="set-letterSpacing" />
            </div>
            <div class="ctl">
              <label class="form-label" for="set-contentWidth">Ancho de contenido <span class="val" data-val="contentWidth"></span></label>
              <input type="range" class="form-range" id="set-contentWidth" />
            </div>
            <div class="ctl">
              <label class="form-label" for="set-paragraphSpacing">Separación de párrafos <span class="val" data-val="paragraphSpacing"></span></label>
              <input type="range" class="form-range" id="set-paragraphSpacing" />
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="set-justify" />
              <label class="form-check-label" for="set-justify" style="font-size:13px">Justificar texto</label>
            </div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header">Colores</div>
          <div class="card-body">
            <div class="row g-2">
              <div class="col-6 ctl">
                <label class="form-label" for="set-textColor">Texto</label>
                <input type="color" class="form-control form-control-color w-100" id="set-textColor" />
              </div>
              <div class="col-6 ctl">
                <label class="form-label" for="set-bgColor">Fondo</label>
                <input type="color" class="form-control form-control-color w-100" id="set-bgColor" />
              </div>
              <div class="col-6 ctl">
                <label class="form-label" for="set-accentColor">Acento</label>
                <input type="color" class="form-control form-control-color w-100" id="set-accentColor" />
              </div>
              <div class="col-6 ctl">
                <label class="form-label" for="set-headingColor">Títulos</label>
                <input type="color" class="form-control form-control-color w-100" id="set-headingColor" />
              </div>
              <div class="col-6 ctl">
                <label class="form-label" for="set-linkColor">Enlaces</label>
                <input type="color" class="form-control form-control-color w-100" id="set-linkColor" />
              </div>
            </div>
            <div class="ctl">
              <label class="form-label" for="set-linkUnderline">Subrayado de enlaces</label>
              <select class="form-select form-select-sm" id="set-linkUnderline">
                <option value="none">Nunca</option>
                <option value="hover">Al pasar el mouse</option>
                <option value="always">Siempre</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header">Código y diagramas</div>
          <div class="card-body">
            <div class="ctl">
              <label class="form-label" for="set-codeFontSize">Tamaño de código <span class="val" data-val="codeFontSize"></span></label>
              <input type="range" class="form-range" id="set-codeFontSize" />
            </div>
            <div class="ctl">
              <label class="form-label" for="set-codeTheme">Tema de código</label>
              <select class="form-select form-select-sm" id="set-codeTheme">
                <option value="auto">Automático (según tema)</option>
                <option value="light">Claro</option>
                <option value="dark">Oscuro</option>
              </select>
            </div>
            <div class="ctl">
              <label class="form-label" for="set-mermaidTheme">Tema de Mermaid</label>
              <select class="form-select form-select-sm" id="set-mermaidTheme">
                <option value="auto">Automático (según tema)</option>
                <option value="default">Default</option>
                <option value="neutral">Neutral</option>
                <option value="forest">Forest</option>
                <option value="dark">Dark</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header">General</div>
          <div class="card-body">
            <div class="ctl mb-0">
              <label class="form-label" for="set-theme">Tema de la interfaz</label>
              <select class="form-select form-select-sm" id="set-theme">
                <option value="light">Claro</option>
                <option value="dark">Oscuro</option>
              </select>
            </div>
          </div>
        </div>
      </aside>

      <!-- Panel derecho: preview en vivo -->
      <section class="settings-preview-pane">
        <div class="preview-hint">Vista previa en vivo — los cambios se aplican y guardan automáticamente.</div>
        <article id="preview" class="markdown-body"></article>
      </section>
    </div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/vendor/bootstrap.bundle.min.js"></script>
  <script src="/config.js"></script>
  <script src="/md-core.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
